<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1050" width="1440" height="1050">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.04"/>
    </filter>
  </defs>

  <rect width="1440" height="1050" fill="rgba(249,250,251,0.5)"/>

  <!-- Navbar -->
  <rect x="0" y="0" width="1440" height="64" fill="#fff"/>
  <rect x="0" y="64" width="1440" height="1" fill="#e2e8f0"/>
  <polyline points="30,32 40,22 40,42" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <text x="50" y="37" font-size="14" fill="#9333ea">⭐</text>
  <text x="74" y="37" font-size="16" font-weight="600" fill="#1e293b" font-family="system-ui, sans-serif">天职测评</text>

  <!-- Questionnaire Card (quiz mode) -->
  <rect x="320" y="100" width="800" height="360" rx="16" fill="#fff" filter="url(#shadow)"/>
  <rect x="320" y="100" width="800" height="360" rx="16" fill="none" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Progress -->
  <rect x="350" y="130" width="740" height="6" rx="3" fill="#f1f5f9"/>
  <rect x="350" y="130" width="500" height="6" rx="3" fill="#9333ea"/>
  <text x="1030" y="128" font-size="13" fill="#64748b" font-family="system-ui, sans-serif">10/15</text>

  <!-- Question -->
  <text x="350" y="180" font-size="16" font-weight="600" fill="#1e293b" font-family="system-ui, sans-serif">在团队中，我通常扮演协调者的角色</text>
  <text x="350" y="210" font-size="13" fill="#64748b" font-family="system-ui, sans-serif">请选择你的认可程度：</text>

  <!-- Likert Scale -->
  <circle cx="440" cy="280" r="24" fill="#f1f5f9"/>
  <text x="440" y="285" font-size="16" fill="#64748b" text-anchor="middle" font-family="system-ui, sans-serif">1</text>
  <circle cx="570" cy="280" r="24" fill="#f1f5f9"/>
  <text x="570" y="285" font-size="16" fill="#64748b" text-anchor="middle" font-family="system-ui, sans-serif">2</text>
  <circle cx="700" cy="280" r="24" fill="#f1f5f9"/>
  <text x="700" y="285" font-size="16" fill="#64748b" text-anchor="middle" font-family="system-ui, sans-serif">3</text>
  <circle cx="830" cy="280" r="28" fill="#9333ea" filter="url(#shadow)"/>
  <text x="830" y="286" font-size="18" font-weight="700" fill="#fff" text-anchor="middle" font-family="system-ui, sans-serif">4</text>
  <circle cx="960" cy="280" r="24" fill="#f1f5f9"/>
  <text x="960" y="285" font-size="16" fill="#64748b" text-anchor="middle" font-family="system-ui, sans-serif">5</text>

  <text x="350" y="325" font-size="12" fill="#94a3b8" font-family="system-ui, sans-serif">非常不同意</text>
  <text x="1030" y="325" font-size="12" fill="#94a3b8" font-family="system-ui, sans-serif">非常同意</text>

  <!-- Nav buttons -->
  <rect x="350" y="360" width="100" height="40" rx="10" fill="#f1f5f9"/>
  <text x="380" y="386" font-size="14" fill="#64748b" font-family="system-ui, sans-serif">上一题</text>
  <rect x="990" y="360" width="100" height="40" rx="10" fill="#9333ea"/>
  <text x="1015" y="386" font-size="14" font-weight="500" fill="#fff" font-family="system-ui, sans-serif">下一题</text>

  <!-- Result Preview -->
  <rect x="270" y="500" width="900" height="480" rx="16" fill="#fff" filter="url(#shadow)"/>
  <rect x="270" y="500" width="900" height="480" rx="16" fill="none" stroke="#e2e8f0" stroke-width="1"/>

  <rect x="720" y="530" r="40" width="80" height="80" rx="40" fill="#f3e8ff"/>
  <text x="720" y="575" font-size="36" fill="#9333ea" text-anchor="middle">⭐</text>

  <text x="720" y="640" font-size="22" font-weight="700" fill="#1e293b" font-family="system-ui, sans-serif" text-anchor="middle">天职分析结果</text>

  <rect x="310" y="670" width="820" height="160" rx="12" fill="#faf5ff"/>
  <text x="340" y="700" font-size="14" fill="#6b21a8" line-height="1.8" font-family="system-ui, sans-serif">
    <tspan x="340" dy="0">根据你的测评结果，你具有明显的协调型人才特质。你在团队中</tspan>
    <tspan x="340" dy="24">善于倾听各方意见，能够平衡不同利益诉求，是天生的团队凝聚</tspan>
    <tspan x="340" dy="24">者。建议你考虑从事需要跨部门协作、团队管理或项目协调方面</tspan>
    <tspan x="340" dy="24">的工作，这将充分发挥你的天赋优势。</tspan>
  </text>

  <!-- Bottom links -->
  <text x="620" y="950" font-size="14" fill="#64748b" font-family="system-ui, sans-serif" text-decoration="underline">重新测试</text>
  <text x="750" y="950" font-size="14" font-weight="500" fill="#6366f1" font-family="system-ui, sans-serif" text-decoration="underline">返回仪表盘</text>
</svg>