<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1100" width="1440" height="1100">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.04"/>
    </filter>
  </defs>

  <rect width="1440" height="1100" fill="rgba(249,250,251,0.5)"/>

  <!-- Navbar -->
  <rect x="0" y="0" width="1440" height="64" fill="#fff"/>
  <rect x="0" y="64" width="1440" height="1" fill="#e2e8f0"/>
  <polyline points="30,32 40,22 40,42" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <text x="50" y="37" font-size="14" fill="#2563eb">🧠</text>
  <text x="74" y="37" font-size="16" font-weight="600" fill="#1e293b" font-family="system-ui, sans-serif">MBTI 人格测评</text>

  <!-- Questionnaire Card -->
  <rect x="320" y="100" width="800" height="520" rx="16" fill="#fff" filter="url(#shadow)"/>
  <rect x="320" y="100" width="800" height="520" rx="16" fill="none" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Progress bar -->
  <rect x="350" y="130" width="740" height="6" rx="3" fill="#f1f5f9"/>
  <rect x="350" y="130" width="222" height="6" rx="3" fill="#3b82f6"/>
  <text x="1030" y="128" font-size="13" fill="#64748b" font-family="system-ui, sans-serif">3/15</text>

  <!-- Question -->
  <text x="350" y="190" font-size="16" font-weight="600" fill="#1e293b" font-family="system-ui, sans-serif">当参加一个聚会时，你通常：</text>

  <!-- Option A -->
  <rect x="350" y="220" width="360" height="80" rx="12" fill="#f9fafb" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="370" y="245" font-size="12" fill="#94a3b8" font-family="system-ui, sans-serif">A</text>
  <text x="370" y="275" font-size="14" fill="#1e293b" font-family="system-ui, sans-serif">与很多人一起交流，享受热闹的氛围</text>

  <!-- Option B -->
  <rect x="730" y="220" width="360" height="80" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="750" y="245" font-size="12" fill="#94a3b8" font-family="system-ui, sans-serif">B</text>
  <text x="750" y="275" font-size="14" fill="#1e293b" font-family="system-ui, sans-serif">只与几个熟悉的人深入交谈，</text>

  <!-- Navigation -->
  <rect x="350" y="470" width="100" height="40" rx="10" fill="#f1f5f9"/>
  <text x="380" y="496" font-size="14" fill="#64748b" font-family="system-ui, sans-serif">上一题</text>
  <rect x="990" y="470" width="100" height="40" rx="10" fill="#3b82f6"/>
  <text x="1015" y="496" font-size="14" font-weight="500" fill="#fff" font-family="system-ui, sans-serif">下一题</text>

  <!-- Result Section (shown after completion) -->
  <rect x="120" y="660" width="1200" height="380" rx="16" fill="#fff" filter="url(#shadow)"/>
  <rect x="120" y="660" width="1200" height="380" rx="16" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

  <text x="720" y="710" font-size="18" fill="#64748b" font-family="system-ui, sans-serif" text-anchor="middle">完成测评后将显示结果</text>
  <rect x="720" y="695" r="40" width="80" height="80" rx="40" fill="#dbeafe" opacity="0.5"/>
  <text x="720" y="740" font-size="32" fill="#2563eb" opacity="0.4" text-anchor="middle">🧠</text>

  <!-- Result Preview (overlapping, to show the result view) -->
  <rect x="320" y="650" width="800" height="400" rx="16" fill="#fff" filter="url(#shadow)"/>
  <rect x="320" y="650" width="800" height="400" rx="16" fill="none" stroke="#e2e8f0" stroke-width="1"/>

  <rect x="720" y="680" r="40" width="80" height="80" rx="40" fill="#dbeafe"/>
  <text x="720" y="730" font-size="36" fill="#2563eb" text-anchor="middle">🧠</text>

  <text x="500" y="800" font-size="22" font-weight="700" fill="#1e293b" font-family="system-ui, sans-serif" text-anchor="middle">你的 MBTI 类型</text>
  <text x="720" y="855" font-size="48" font-weight="700" fill="#2563eb" font-family="system-ui, sans-serif" text-anchor="middle">INTJ</text>
  <text x="720" y="885" font-size="14" fill="#64748b" font-family="system-ui, sans-serif" text-anchor="middle">建筑师型人格 — 富有想象力和战略性的思想家</text>

  <!-- Dimension bars -->
  <rect x="420" y="910" width="600" height="80" rx="8"/>
  <text x="420" y="930" font-size="12" fill="#64748b" font-family="system-ui, sans-serif">外向 E</text>
  <text x="980" y="930" font-size="12" fill="#64748b" font-family="system-ui, sans-serif">内向 I</text>
  <rect x="420" y="940" width="600" height="8" rx="4" fill="#f1f5f9"/>
  <rect x="660" y="940" width="360" height="8" rx="4" fill="#3b82f6"/>
  <text x="720" y="960" font-size="11" fill="#94a3b8" font-family="system-ui, sans-serif" text-anchor="middle">E/I</text>
</svg>