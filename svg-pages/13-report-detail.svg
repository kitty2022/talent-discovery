  <rect x="1260" y="20" width="70" height="28" rx="6" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <text x="1273" y="39" font-size="13" fill="#64748b" font-family="system-ui, sans-serif">导出</text>

