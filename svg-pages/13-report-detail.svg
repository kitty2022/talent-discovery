  <text x="140" y="560" font-size="16" font-weight="600" fill="#1e293b" font-family="system-ui, sans-serif">命格分析</text>
  <text x="140" y="595" font-size="14" fill="#475569" line-height="1.8" font-family="system-ui, sans-serif">
    <tspan x="140" dy="0">日主戊土，生于寅月，木旺土虚。月干透丙火偏印，时支午火为日主之刃，火为用神。</tspan>
    <tspan x="140" dy="24">命局土火相生，印星得力，主智慧聪颖，学习能力强。年柱甲辰，七杀坐库，</tspan>
    <tspan x="140" dy="24">事业心强，有领导才能。时柱壬午，偏财坐印，中年后财运亨通。</tspan>
    <tspan x="140" dy="24">整体而言，此命局为中等偏上格局，宜从事教育、文化、管理类职业。</tspan>
  </text>

