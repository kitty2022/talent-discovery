  <text x="140" y="175" font-size="15" fill="#c7d2fe" font-family="system-ui, sans-serif">基于八字命理、MBTI人格、霍兰德测评与天职分析的综合评估</text>
  <text x="140" y="200" font-size="13" fill="#a5b4fc" font-family="system-ui, sans-serif">生成时间：2026年6月15日 14:30</text>

