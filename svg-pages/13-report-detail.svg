  <rect x="50" y="22" width="24" height="24" rx="4" fill="none" stroke="#6366f1" stroke-width="2"/>
  <text x="82" y="37" font-size="15" font-weight="600" fill="#1e293b" font-family="system-ui, sans-serif">张三 · 综合天赋分析报告</text>
  <!-- Share button -->
  <rect x="1180" y="20" width="70" height="28" rx="6" fill="none" stroke="#94a3b8" stroke-width="1"/>
