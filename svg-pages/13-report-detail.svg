  <text x="570" y="955" font-size="12" fill="#64748b" font-family="system-ui, sans-serif" text-anchor="middle">28-37岁</text>
  <text x="570" y="985" font-size="20" font-weight="700" fill="#1e293b" font-family="serif" text-anchor="middle">己巳</text>

