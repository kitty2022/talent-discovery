  <text x="158" y="275" font-size="13" font-weight="500" fill="#c2410c" font-family="system-ui, sans-serif">八字</text>

  <rect x="230" y="250" width="120" height="38" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="262" y="275" font-size="10">🧠</text>
  <text x="280" y="275" font-size="13" fill="#64748b" font-family="system-ui, sans-serif">MBTI</text>

  <rect x="360" y="250" width="120" height="38" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="392" y="275" font-size="10">📊</text>
  <text x="410" y="275" font-size="13" fill="#64748b" font-family="system-ui, sans-serif">霍兰德</text>

