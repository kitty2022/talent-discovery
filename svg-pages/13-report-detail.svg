  <text x="770" y="480" font-size="24" font-weight="700" fill="#92400e" font-family="serif" text-anchor="middle">戊戌</text>

  <rect x="905" y="420" width="240" height="90" rx="10" fill="#fffbeb"/>
  <text x="1025" y="448" font-size="12" fill="#64748b" font-family="system-ui, sans-serif" text-anchor="middle">时柱</text>
  <text x="1025" y="480" font-size="24" font-weight="700" fill="#92400e" font-family="serif" text-anchor="middle">壬午</text>

