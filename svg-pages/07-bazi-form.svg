<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f5f4"/>
      <stop offset="100%" stop-color="#f0f4ff"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.04"/>
    </filter>
  </defs>

  <rect width="1440" height="900" fill="rgba(249,250,251,0.5)"/>

  <!-- Navbar -->
  <rect x="0" y="0" width="1440" height="64" fill="#fff"/>
  <rect x="0" y="64" width="1440" height="1" fill="#e2e8f0"/>
  <!-- Back arrow -->
  <polyline points="30,32 40,22 40,42" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <text x="50" y="37" font-size="14" fill="#d97706">☯</text>
  <text x="74" y="37" font-size="16" font-weight="600" fill="#1e293b" font-family="system-ui, sans-serif">八字排盘</text>

  <!-- Form Card -->
  <rect x="370" y="100" width="700" height="500" rx="16" fill="#fff" filter="url(#shadow)"/>
  <rect x="370" y="100" width="700" height="500" rx="16" fill="none" stroke="#e2e8f0" stroke-width="1"/>

  <text x="410" y="150" font-size="20" font-weight="600" fill="#1e293b" font-family="system-ui, sans-serif">输入出生信息</text>
  <text x="410" y="180" font-size="14" fill="#64748b" font-family="system-ui, sans-serif">填写公历出生日期和时辰，系统将自动进行八字排盘</text>

  <!-- Birth Date -->
  <text x="410" y="230" font-size="14" font-weight="500" fill="#374151" font-family="system-ui, sans-serif">出生日期（公历）</text>
  <rect x="410" y="240" width="310" height="48" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="426" y="270" font-size="14" fill="#94a3b8" font-family="system-ui, sans-serif">2024-01-15</text>
  <rect x="728" y="240" width="24" height="24" rx="6" fill="none" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Gender -->
  <text x="740" y="230" font-size="14" font-weight="500" fill="#374151" font-family="system-ui, sans-serif">性别</text>
  <rect x="740" y="240" width="310" height="48" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="756" y="270" font-size="14" fill="#1e293b" font-family="system-ui, sans-serif">男</text>
  <polyline points="1020,258 1028,266 1036,258" fill="none" stroke="#64748b" stroke-width="2"/>

  <!-- Hour -->
  <text x="410" y="320" font-size="14" font-weight="500" fill="#374151" font-family="system-ui, sans-serif">时辰</text>
  <rect x="410" y="330" width="310" height="48" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="426" y="360" font-size="14" fill="#1e293b" font-family="system-ui, sans-serif">8时</text>
  <polyline points="690,348 698,356 706,348" fill="none" stroke="#64748b" stroke-width="2"/>

  <!-- Minute -->
  <text x="740" y="320" font-size="14" font-weight="500" fill="#374151" font-family="system-ui, sans-serif">分钟</text>
  <rect x="740" y="330" width="310" height="48" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="756" y="360" font-size="14" fill="#1e293b" font-family="system-ui, sans-serif">0</text>

  <!-- Submit Button -->
  <rect x="410" y="420" width="620" height="48" rx="12" fill="#d97706"/>
  <text x="700" y="450" font-size="16" font-weight="600" fill="#fff" font-family="system-ui, sans-serif">✨ 开始排盘</text>
</svg>