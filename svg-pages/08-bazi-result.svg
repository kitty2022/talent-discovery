<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1400" width="1440" height="1400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f5f4"/>
      <stop offset="100%" stop-color="#f0f4ff"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.04"/>
    </filter>
  </defs>

  <rect width="1440" height="1400" fill="rgba(249,250,251,0.5)"/>

  <!-- Navbar -->
  <rect x="0" y="0" width="1440" height="64" fill="#fff"/>
  <rect x="0" y="64" width="1440" height="1" fill="#e2e8f0"/>
  <polyline points="30,32 40,22 40,42" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <text x="50" y="37" font-size="14" fill="#d97706">☯</text>
  <text x="74" y="37" font-size="16" font-weight="600" fill="#1e293b" font-family="system-ui, sans-serif">八字排盘</text>

  <!-- Result Card -->
  <rect x="120" y="100" width="1200" height="1200" rx="16" fill="#fff" filter="url(#cardShadow)"/>
  <rect x="120" y="100" width="1200" height="1200" rx="16" fill="none" stroke="#e2e8f0" stroke-width="1"/>

  <text x="150" y="145" font-size="18" font-weight="600" fill="#1e293b" font-family="system-ui, sans-serif">
    <tspan font-size="20" fill="#d97706">✨ </tspan>八字排盘结果
  </text>

  <!-- Four Pillars -->
  <rect x="150" y="170" width="250" height="100" rx="12" fill="#fffbeb"/>
  <text x="260" y="195" font-size="13" fill="#64748b" font-family="system-ui, sans-serif" text-anchor="middle">年柱</text>
  <text x="275" y="235" font-size="28" font-weight="700" fill="#92400e" font-family="serif" text-anchor="middle">甲辰</text>
  <text x="275" y="255" font-size="12" fill="#64748b" font-family="system-ui, sans-serif" text-anchor="middle">覆灯火</text>

  <rect x="415" y="170" width="250" height="100" rx="12" fill="#fffbeb"/>
  <text x="540" y="195" font-size="13" fill="#64748b" font-family="system-ui, sans-serif" text-anchor="middle">月柱</text>
  <text x="540" y="235" font-size="28" font-weight="700" fill="#92400e" font-family="serif" text-anchor="middle">丙寅</text>
  <text x="540" y="255" font-size="12" fill="#64748b" font-family="system-ui, sans-serif" text-anchor="middle">炉中火</text>

  <rect x="680" y="170" width="250" height="100" rx="12" fill="#fffbeb"/>
  <text x="805" y="195" font-size="13" fill="#64748b" font-family="system-ui, sans-serif" text-anchor="middle">日柱</text>
  <text x="805" y="235" font-size="28" font-weight="700" fill="#92400e" font-family="serif" text-anchor="middle">戊戌</text>
  <text x="805" y="255" font-size="12" fill="#64748b" font-family="system-ui, sans-serif" text-anchor="middle">平地木</text>

  <rect x="945" y="170" width="250" height="100" rx="12" fill="#fffbeb"/>
  <text x="1070" y="195" font-size="13" fill="#64748b" font-family="system-ui, sans-serif" text-anchor="middle">时柱</text>
  <text x="1070" y="235" font-size="28" font-weight="700" fill="#92400e" font-family="serif" text-anchor="middle">壬午</text>
  <text x="1070" y="255" font-size="12" fill="#64748b" font-family="system-ui, sans-serif" text-anchor="middle">杨柳木</text>

  <!-- Day Master -->
  <rect x="150" y="290" width="1045" height="56" rx="12" fill="#eef2ff"/>
  <text x="180" y="325" font-size="15" fill="#64748b" font-family="system-ui, sans-serif">日主：</text>
  <text x="215" y="325" font-size="22" font-weight="700" fill="#6366f1" font-family="serif">戊</text>
  <text x="245" y="325" font-size="15" fill="#64748b" font-family="system-ui, sans-serif">（阳土）</text>

  <!-- Wu Yun Liu Qi -->
  <rect x="150" y="370" width="1045" height="160" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="180" y="400" font-size="15" font-weight="600" fill="#166534" font-family="system-ui, sans-serif">🌿 五运六气 · 先天体质</text>
  <rect x="180" y="420" width="480" height="56" rx="10" fill="rgba(255,255,255,0.6)"/>
  <text x="330" y="442" font-size="13" fill="#64748b" font-family="system-ui, sans-serif" text-anchor="middle">五运</text>
  <text x="330" y="464" font-size="18" font-weight="700" fill="#16a34a" font-family="system-ui, sans-serif" text-anchor="middle">土运</text>
  <rect x="685" y="420" width="480" height="56" rx="10" fill="rgba(255,255,255,0.6)"/>
  <text x="845" y="442" font-size="13" fill="#64748b" font-family="system-ui, sans-serif" text-anchor="middle">司天</text>
  <text x="845" y="464" font-size="18" font-weight="700" fill="#16a34a" font-family="system-ui, sans-serif" text-anchor="middle">太阴湿土</text>
  <text x="180" y="500" font-size="13" fill="#166534" font-family="system-ui, sans-serif">土运平气之年，体质偏湿，注意脾胃调理</text>

  <!-- Five Elements -->
  <text x="150" y="575" font-size="16" font-weight="600" fill="#1e293b" font-family="system-ui, sans-serif">五行分布</text>
  <rect x="150" y="590" width="190" height="70" rx="10" fill="#f9fafb"/>
  <text x="245" y="618" font-size="20" font-weight="700" fill="#10b981" font-family="system-ui, sans-serif" text-anchor="middle">木</text>
  <text x="245" y="645" font-size="13" fill="#64748b" font-family="system-ui, sans-serif" text-anchor="middle">●●●○</text>

  <rect x="358" y="590" width="190" height="70" rx="10" fill="#f9fafb"/>
  <text x="453" y="618" font-size="20" font-weight="700" fill="#f59e0b" font-family="system-ui, sans-serif" text-anchor="middle">火</text>
  <text x="453" y="645" font-size="13" fill="#64748b" font-family="system-ui, sans-serif" text-anchor="middle">●●○○</text>

  <rect x="566" y="590" width="190" height="70" rx="10" fill="#f9fafb"/>
  <text x="661" y="618" font-size="20" font-weight="700" fill="#8B7355" font-family="system-ui, sans-serif" text-anchor="middle">土</text>
  <text x="661" y="645" font-size="13" fill="#64748b" font-family="system-ui, sans-serif" text-anchor="middle">●●●●</text>

  <rect x="774" y="590" width="190" height="70" rx="10" fill="#f9fafb"/>
  <text x="869" y="618" font-size="20" font-weight="700" fill="#f59e0b" font-family="system-ui, sans-serif" text-anchor="middle">金</text>
  <text x="869" y="645" font-size="13" fill="#64748b" font-family="system-ui, sans-serif" text-anchor="middle">●○○○</text>

  <rect x="982" y="590" width="190" height="70" rx="10" fill="#f9fafb"/>
  <text x="1077" y="618" font-size="20" font-weight="700" fill="#3b82f6" font-family="system-ui, sans-serif" text-anchor="middle">水</text>
  <text x="1077" y="645" font-size="13" fill="#64748b" font-family="system-ui, sans-serif" text-anchor="middle">●●○○</text>

  <!-- Yong Shen / Ji Shen -->
  <rect x="150" y="685" width="510" height="60" rx="12" fill="#f0fdf4"/>
  <text x="300" y="715" font-size="14" fill="#64748b" font-family="system-ui, sans-serif" text-anchor="middle">用神</text>
  <text x="300" y="738" font-size="20" font-weight="700" fill="#16a34a" font-family="system-ui, sans-serif" text-anchor="middle">火</text>

  <rect x="680" y="685" width="510" height="60" rx="12" fill="#fef2f2"/>
  <text x="830" y="715" font-size="14" fill="#64748b" font-family="system-ui, sans-serif" text-anchor="middle">忌神</text>
  <text x="830" y="738" font-size="20" font-weight="700" fill="#dc2626" font-family="system-ui, sans-serif" text-anchor="middle">金</text>

  <!-- Da Yun -->
  <text x="150" y="790" font-size="16" font-weight="600" fill="#1e293b" font-family="system-ui, sans-serif">大运走势</text>
  <rect x="150" y="805" width="160" height="80" rx="12" fill="#f9fafb"/>
  <text x="230" y="832" font-size="12" fill="#64748b" font-family="system-ui, sans-serif" text-anchor="middle">8-17岁</text>
  <text x="230" y="858" font-size="22" font-weight="700" fill="#1e293b" font-family="serif" text-anchor="middle">丁卯</text>

  <rect x="322" y="805" width="160" height="80" rx="12" fill="#f9fafb"/>
  <text x="402" y="832" font-size="12" fill="#64748b" font-family="system-ui, sans-serif" text-anchor="middle">18-27岁</text>
  <text x="402" y="858" font-size="22" font-weight="700" fill="#1e293b" font-family="serif" text-anchor="middle">戊辰</text>

  <rect x="494" y="805" width="160" height="80" rx="12" fill="#f9fafb"/>
  <text x="574" y="832" font-size="12" fill="#64748b" font-family="system-ui, sans-serif" text-anchor="middle">28-37岁</text>
  <text x="574" y="858" font-size="22" font-weight="700" fill="#1e293b" font-family="serif" text-anchor="middle">己巳</text>

  <rect x="666" y="805" width="160" height="80" rx="12" fill="#f9fafb"/>
  <text x="746" y="832" font-size="12" fill="#64748b" font-family="system-ui, sans-serif" text-anchor="middle">38-47岁</text>
  <text x="746" y="858" font-size="22" font-weight="700" fill="#1e293b" font-family="serif" text-anchor="middle">庚午</text>

  <rect x="838" y="805" width="160" height="80" rx="12" fill="#f9fafb"/>
  <text x="918" y="832" font-size="12" fill="#64748b" font-family="system-ui, sans-serif" text-anchor="middle">48-57岁</text>
  <text x="918" y="858" font-size="22" font-weight="700" fill="#1e293b" font-family="serif" text-anchor="middle">辛未</text>

  <!-- Bottom links -->
  <text x="530" y="930" font-size="14" fill="#64748b" font-family="system-ui, sans-serif" text-decoration="underline">重新排盘</text>
  <text x="700" y="930" font-size="14" font-weight="500" fill="#6366f1" font-family="system-ui, sans-serif" text-decoration="underline">返回仪表盘</text>
</svg>