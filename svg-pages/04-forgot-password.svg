<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef9f0"/>
      <stop offset="50%" stop-color="#f0f4ff"/>
      <stop offset="100%" stop-color="#fdf2f8"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1440" height="900" fill="url(#bg)"/>

  <!-- Card -->
  <rect x="460" y="100" width="520" height="500" rx="24" fill="#fff" filter="url(#shadow)"/>
  <rect x="460" y="100" width="520" height="500" rx="24" fill="none" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Logo -->
  <circle cx="695" cy="140" r="16" fill="#6366f1" opacity="0.9"/>
  <text x="718" y="146" font-size="22" font-weight="700" fill="url(#brand)" font-family="system-ui, sans-serif">天赋星鉴</text>

  <text x="640" y="195" font-size="28" font-weight="700" fill="#1e293b" font-family="system-ui, sans-serif">忘记密码</text>
  <text x="580" y="225" font-size="16" fill="#64748b" font-family="system-ui, sans-serif">输入注册邮箱，获取重置链接</text>

  <!-- Form -->
  <text x="500" y="285" font-size="14" font-weight="500" fill="#374151" font-family="system-ui, sans-serif">邮箱</text>
  <rect x="500" y="295" width="440" height="48" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="516" y="325" font-size="15" fill="#94a3b8" font-family="system-ui, sans-serif">your@email.com</text>

  <!-- Submit Button -->
  <rect x="500" y="370" width="440" height="48" rx="12" fill="#6366f1"/>
  <text x="678" y="400" font-size="16" font-weight="600" fill="#fff" font-family="system-ui, sans-serif">发送重置链接</text>

  <!-- Back to login -->
  <text x="670" y="460" font-size="14" fill="#6366f1" font-family="system-ui, sans-serif" text-decoration="underline">← 返回登录</text>
</svg>